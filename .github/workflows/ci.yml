name: Python CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    env:
      APP_ENV: testing

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting
        run: ruff check .

      - name: Check environment
        run: echo "Environment is $APP_ENV"

      - name: Run tests
        run: python -m pytest --html=report.html --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: report.html

  build:

    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: built-package
          path: dist/*
  deploy:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: python-build
          path: dist/

      - name: Show artifact
        run: ls -R dist/

      - name: Deploy application
        run: echo "Deploying application..."
  docker-build:
  needs: test
  runs-on: ubuntu-latest

  steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t github-actions-demo:latest .